<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Nawaf | IT & Cybersecurity Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #fff;
            --apple-border: #e6e6e9;
            --apple-blue: #0071e3;
            --apple-blue-light: #edf5ff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #86868b;
            --success-light: #effaf2;
            --size-body: 14px;
            --size-small: 12px;
            --size-label: 11px;
            --size-section: 27px;
            --size-card: 18px;
            --size-number: 30px;
            --space-section: 48px;
            --space-card: 26px;
            --radius-card: 22px;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Tajawal", "Segoe UI", sans-serif;
            background: var(--apple-bg);
            color: var(--text-primary);
            font-size: var(--size-body);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 48px;
        }

        a {
            color: var(--apple-blue);
        }

        button {
            font: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid #59a4ff;
            outline-offset: 5px;
        }

        img {
            max-width: 100%;
        }

        [id] {
            scroll-margin-top: 80px;
        }

        .apple-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 62px;
            background: rgba(250, 250, 252, .88);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-bottom: 1px solid rgba(0, 0, 0, .06);
        }

        .apple-nav .nav-content {
            height: 100%;
            max-width: 1160px;
            margin: auto;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .apple-nav .nav-brand {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .01em;
        }

        .apple-nav .nav-brand>i {
            display: none;
        }

        .apple-nav .language-toggle {
            display: flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--apple-border);
            background: white;
            color: var(--text-primary);
            border-radius: 50px;
            padding: 8px 15px;
            min-height: 38px;
            font-size: 12px;
            cursor: pointer;
        }

        .scroll-indicator {
            height: 2px;
            position: absolute;
            bottom: 0;
            inset-inline-start: 0;
            background: var(--apple-blue);
            width: 0;
        }

        .container {
            max-width: 1160px;
            padding: 0 28px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 64px;
        }

        .bento-card {
            min-width: 0;
            background: transparent;
            border: 0;
            box-shadow: none;
            border-radius: 0;
            padding: 0;
        }

        .hero-card {
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            text-align: center;
            gap: 22px;
            padding: 64px 0 10px;
        }

        .hero-info {
            width: 100%;
            min-width: 0;
        }

        .hero-name {
            font-size: clamp(34px, 4.2vw, 48px);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -.03em;
            margin-bottom: 12px;
        }

        .hero-role {
            font-size: clamp(16px, 2vw, 21px);
            font-weight: 500;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .hero-location {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-tertiary);
            margin: 14px 0 26px;
        }

        .hero-avatar-wrap {
            position: relative;
            width: 152px;
            height: 152px;
            min-width: 152px;
            min-height: 152px;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 50%;
            background: #090909;
            padding: 0;
            border: 4px solid #fff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .05), 0 12px 30px rgba(0, 0, 0, .09);
            isolation: isolate;
        }

        .hero-avatar {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 50%;
            transform: scale(1.15);
            transform-origin: 50% 40%;
            border-radius: 0;
            background: #090909;
            display: block;
        }

        .avatar-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -.03em;
            color: #c3c3c8;
            background: #090909;
            z-index: 0;
        }

        .hero-avatar-wrap:has(img[data-missing]) {
            display: block;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }

        .apple-pill-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 21px;
            min-height: 44px;
            border: 1px solid var(--apple-border);
            border-radius: 50px;
            background: white;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            line-height: 1.6;
            transition: background .2s, transform .2s;
        }

        .apple-pill-btn:hover {
            background: #ebebef;
            transform: translateY(-1px);
        }

        .primary-action {
            background: var(--apple-blue);
            border-color: var(--apple-blue);
            color: white;
        }

        .primary-action:hover {
            background: #0077ed;
        }

        .hero-actions .apple-pill-btn i {
            display: none;
        }

        .hero-pills {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px 18px;
            flex-wrap: wrap;
        }

        .hero-pills .apple-pill-btn {
            min-height: 36px;
            padding: 5px 0;
            border: 0;
            border-radius: 0;
            background: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 400;
            overflow-wrap: anywhere;
        }

        .hero-pills .apple-pill-btn:hover {
            color: var(--apple-blue);
            transform: none;
        }

        .hero-pills i {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .hero- signature {
            display: block;
            width: clamp(200px, 26vw, 280px);
            height: auto;
            margin: 8px auto 20px;
            mix-blend-mode: multiply;
            object-fit: contain;
        }

        .layout-grid,
        .main-column {
            display: flex;
            flex-direction: column;
            gap: 64px;
            min-width: 0;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .section-icon {
            display: none;
        }

        .section-title,
        .credential-grid .section-title,
        footer .section-title {
            font-size: var(--size-section);
            line-height: 1.45;
            font-weight: 650;
            letter-spacing: -.025em;
        }

        .summary-text,
        .case-field p,
        .project-details .case-field p,
        #experience .tangible-work li {
            color: var(--text-secondary);
            font-size: var(--size-body);
            line-height: 1.9;
            text-align: start;
            max-width: 82ch;
        }

        .profile-intro {
            max-width: 770px;
            margin: 0 auto;
            text-align: center;
        }

        .profile-intro .section-header {
            justify-content: center;
            margin-bottom: 16px;
        }

        .profile-intro .section-title {
            font-size: 17px;
            color: var(--text-primary);
            letter-spacing: 0;
        }

        .profile-intro .summary-text {
            text-align: center;
            font-size: 17px;
            line-height: 1.9;
        }

        .apple-timeline {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .timeline-card {
            min-width: 0;
            background: white;
            border-radius: var(--radius-card);
            padding: 30px;
            border: 1px solid rgba(0, 0, 0, .035);
        }

        .timeline-top {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }

        .job-title,
        #experience .job-title {
            font-size: var(--size-card);
            font-weight: 650;
            line-height: 1.6;
            letter-spacing: -.015em;
            overflow-wrap: anywhere;
        }

        .date-chip,
        #experience .date-chip {
            display: inline-block;
            font-size: var(--size-small);
            line-height: 1.7;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .company-row,
        #experience .company-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .company-label,
        #experience .company-label {
            font-size: var(--size-small);
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .apple-tag {
            font-size: 11px;
            background: #f0f0f3;
            color: var(--text-secondary);
            border-radius: 6px;
            padding: 3px 8px;
        }

        .project-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .project-link-btn:hover {
            text-decoration: underline;
        }

        .project-link-btn i {
            font-size: 10px;
        }

        .case-study {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0 30px 26px;
        }

        .case-study>.timeline-top {
            padding-top: 28px;
        }

        .case-metrics {
            display: flex;
            gap: 20px;
            padding: 18px 0;
            margin: 0 0 6px;
            border-top: 1px solid var(--apple-border);
            border-bottom: 1px solid var(--apple-border);
        }

        .case-metrics>div {
            flex: 1;
            min-width: 0;
        }

        .case-metrics strong {
            display: block;
            font-size: var(--size-number);
            letter-spacing: -.025em;
            font-weight: 650;
            line-height: 1.25;
        }

        .case-metrics span {
            display: block;
            font-size: var(--size-small);
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.6;
        }

        .case-field {
            margin: 16px 0;
        }

        .case-field h3,
        .project-details .case-field h3 {
            font-size: var(--size-label);
            text-transform: uppercase;
            letter-spacing: .03em;
            color: var(--text-tertiary);
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .case-field p {
            font-size: var(--size-body);
            line-height: 1.9;
            color: var(--text-secondary);
        }

        .case-study>.project-link-btn {
            margin-top: auto;
            padding-top: 16px;
        }

        #task-governance-project {
            background: #17232f;
            color: #f5f5f7;
            border: 0;
        }

        #task-governance-project .date-chip,
        #task-governance-project .company-label,
        #task-governance-project .case-metrics span,
        #task-governance-project .case-field h3 {
            color: #aab7c6;
        }

        #task-governance-project .case-field p {
            color: #d1d9e2;
        }

        #task-governance-project .case-metrics {
            border-color: #37434f;
        }

        #task-governance-project .project-link-btn {
            color: #72b7ff;
        }

        #grc-excel-project {
            background: #edf4ee;
            border: 0;
        }

        #grc-excel-project .case-metrics {
            border-color: #ceddd1;
        }

        #grc-excel-project .case-metrics strong {
            color: #2e6547;
        }

        .other-projects {
            margin-top: 22px;
        }

        .other-projects .timeline-card {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 0 32px;
        }

        .other-projects .timeline-top {
            grid-column: 1;
            grid-row: 1/3;
        }

        .other-projects .company-row {
            grid-column: 1;
            grid-row: 3;
        }

        .other-projects .summary-text {
            grid-column: 2;
            grid-row: 1/3;
            font-size: 14px;
        }

        .other-projects .project-link-btn {
            grid-column: 2;
            grid-row: 3;
            justify-self: start;
        }

        #experience .job-title {
            font-size: 17px;
        }

        #experience .summary-text {
            font-size: 14px;
        }

        .focus-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 28px;
            padding: 32px 0;
            border-top: 1px solid var(--apple-border);
            border-bottom: 1px solid var(--apple-border);
        }

        .focus-card {
            min-width: 0;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            color: inherit;
            background: transparent;
            padding: 0;
        }

        .focus-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--apple-blue);
            font-size: 19px;
            margin-bottom: 16px;
        }

        .focus-top span {
            font-size: 11px;
            letter-spacing: .12em;
            font-weight: 600;
        }

        .focus-card h2 {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .focus-card p {
            font-size: 13px;
            line-height: 1.9;
            color: var(--text-secondary);
            margin-bottom: 18px;
        }

        .focus-proof {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: auto;
            line-height: 1.7;
        }

        .focus-arrow {
            display: none;
        }

        .adaptable-card {
            padding: 38px 0 0;
            border-top: 1px solid var(--apple-border);
        }

        .adaptable-card .summary-text {
            max-width: 92ch;
            font-size: 15px;
        }

        .adaptable-card .section-title {
            font-size: 26px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 26px 38px;
        }

        .skill-group {
            min-width: 0;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--apple-border);
        }

        .skill-group-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .skill-group-title>i {
            display: none;
        }

        .tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .apple-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border: 1px solid #dedee3;
            border-radius: 7px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .apple-chip>i {
            display: none;
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .file-item {
            min-width: 0;
            background: white;
            padding: 22px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-radius: 18px;
            text-decoration: none;
            color: inherit;
        }

        .file-item-icon {
            font-size: 21px;
            color: var(--apple-blue);
        }

        .file-item h4 {
            font-size: 14px;
            font-weight: 550;
        }

        .file-item p {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-inline-start: auto;
        }

        .side-column {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 28px;
            align-items: start;
        }

        .side-column>.bento-card {
            padding: 28px;
            background: white;
            border-radius: 24px;
        }

        .side-column .section-title {
            font-size: 21px;
        }

        .side-column .section-header {
            margin-bottom: 20px;
        }

        #certifications-card {
            grid-row: span 2;
        }

        .side-item-box {
            margin-bottom: 22px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--apple-border);
        }

        .side-item-box:last-child {
            border: 0;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .side-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.7;
            margin-bottom: 6px;
        }

        .side-sub {
            font-size: 12px;
            color: var(--apple-blue);
            margin-bottom: 6px;
        }

        .side-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.85;
        }

        .cert-specs {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.9;
            margin-top: 12px;
        }

        .dot {
            color: var(--apple-blue);
        }

        .qr-card {
            text-align: center;
        }

        .qr-code-img {
            width: 112px;
            height: 112px;
            display: block;
            margin: 0 auto 16px;
        }

        .qr-card .section-header {
            justify-content: center;
        }

        .lang-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            padding: 10px 0;
        }

        .lang-name {
            font-size: 14px;
        }

        .lang-check {
            font-size: 13px;
            color: #3e8b60;
        }

        footer.bento-card {
            padding: 40px 0 0;
            border-top: 1px solid var(--apple-border);
        }

        footer .section-title {
            font-size: clamp(23px, 3vw, 34px);
            margin-bottom: 24px;
        }

        body>.container:last-of-type {
            margin-top: 64px !important;
        }

        .apple-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .apple-list li {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .3);
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            width: 100%;
            max-width: 340px;
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 80px #0002;
        }

        .modal-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .modal-title-row h3 {
            font-size: 18px;
        }

        .modal-close-icon {
            border: 0;
            background: #f1f1f4;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-action-btn {
            min-height: 48px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 14px;
            text-decoration: none;
        }

        .btn-call {
            background: var(--apple-blue);
            color: white;
        }

        .btn-wa {
            background: #eef8f0;
            color: #128c54;
        }

        @media(max-width:820px) {
            .container,
            .layout-grid,
            .main-column {
                gap: 44px;
            }

            .container {
                padding: 0 22px;
            }

            .hero-card {
                padding-top: 44px;
            }

            .apple-timeline {
                grid-template-columns: minmax(0, 1fr);
            }

            .case-study {
                padding: 0 26px 26px;
            }

            .case-metrics strong {
                font-size: 36px;
            }

            .side-column {
                gap: 20px;
            }

            .focus-grid {
                gap: 20px;
            }

            .other-projects .timeline-card {
                display: block;
            }

            .other-projects .summary-text {
                margin: 10px 0;
            }

            .skills-grid {
                gap: 22px;
            }
        }

        @media(max-width:600px) {
            body {
                padding-bottom: max(28px, env(safe-area-inset-bottom));
            }

            .container {
                padding: 0 18px;
                gap: 38px;
            }

            .layout-grid,
            .main-column {
                gap: 38px;
            }

            .nav-content {
                padding: 0 18px;
            }

            .apple-nav {
                height: 56px;
            }

            .hero-card {
                padding: 36px 0 0;
                gap: 20px;
            }

            .hero-name {
                font-size: 42px;
                margin-bottom: 12px;
            }

            .hero-role {
                font-size: 15px;
            }

            .hero-location {
                font-size: 11px;
